name: dart_modernizer
description: >-
  Analyzer-based codemod that migrates this Flutter codebase to modern Dart
  language features (dot shorthands, private named parameters, primary
  constructors). Resolved-AST driven, dry-run by default, re-analyze verified.
publish_to: none
version: 0.1.0

environment:
  sdk: ">=3.7.0 <4.0.0"

dependencies:
  analyzer: ">=7.0.0 <11.0.0"
  args: ^2.5.0
  collection: ^1.18.0
  dart_style: ">=3.0.0 <4.0.0"
  path: ^1.9.0
  pub_semver: ^2.1.4
  yaml: ^3.1.2

dev_dependencies:
  lints: ">=4.0.0 <7.0.0"
  test: ^1.25.0
